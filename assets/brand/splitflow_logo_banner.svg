<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Radial Core Glow -->
    <radialGradient id="orangeGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <!-- Glacial Blue Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#9ED8FF"/>
    </linearGradient>

    <!-- Diamond Core Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="320" fill="#050505" rx="12"/>
  
  <!-- Architectural Grid Backdrop -->
  <rect width="1200" height="320" fill="url(#grid)" rx="12"/>
  <rect width="1200" height="320" fill="url(#orangeGlow)" rx="12"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" rx="11"/>
  <rect x="8" y="8" width="1184" height="304" fill="none" stroke="rgba(249, 115, 22, 0.2)" stroke-width="1" rx="8"/>

  <!-- Left Side: Geometric Brand Logo Mark -->
  <g transform="translate(140, 160)">
    <!-- Outer Rotated Square -->
    <rect x="-55" y="-55" width="110" height="110" fill="#0C0D10" stroke="rgba(255,255,255,0.15)" stroke-width="2" transform="rotate(45)"/>
    
    <!-- Middle Accent Ring -->
    <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="#F97316" stroke-width="2.5" stroke-dasharray="8 4" transform="rotate(45)"/>
    
    <!-- Inner Core Diamond -->
    <rect x="-24" y="-24" width="48" height="48" fill="url(#diamondGrad)" transform="rotate(45)"/>
    
    <!-- Micro Crosshair Nodes -->
    <circle cx="0" cy="-78" r="3" fill="#F97316"/>
    <circle cx="0" cy="78" r="3" fill="#9ED8FF"/>
    <circle cx="-78" cy="0" r="3" fill="#F5F7FA"/>
    <circle cx="78" cy="0" r="3" fill="#F5F7FA"/>
  </g>

  <!-- Right Side: Wordmark & Typography -->
  <g transform="translate(270, 0)">
    <!-- Protocol Version Tag -->
    <rect x="0" y="72" width="280" height="24" fill="#0C0D10" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1" rx="4"/>
    <circle cx="14" cy="84" r="4" fill="#4ade80"/>
    <text x="26" y="90" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#F97316" letter-spacing="2">
      STELLAR SOROBAN V2.0 | PROTOCOL
    </text>

    <!-- Main Title Wordmark -->
    <text x="0" y="165" font-family="'Michroma', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#F5F7FA" letter-spacing="4">
      SPLITFLOW
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="205" font-family="'Michroma', 'Arial', sans-serif" font-size="16" font-weight="700" fill="url(#textGrad)" letter-spacing="6">
      DECENTRALIZED ROYALTY DISTRIBUTION ENGINE
    </text>

    <!-- Technical Specs Telemetry Ribbon -->
    <g transform="translate(0, 235)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7D8794">
        PRECISION: <tspan fill="#F5F7FA">10,000 BPS (0.01%)</tspan>  |  SETTLEMENT: <tspan fill="#4ade80">&lt;5s ATOMIC</tspan>  |  RUNTIME: <tspan fill="#9ED8FF">SOROBAN WASM</tspan>
      </text>
    </g>
  </g>
</svg>
