<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Mark -->
  <g transform="translate(80, 80)">
    <rect x="-36" y="-36" width="72" height="72" fill="#0C0D10" stroke="rgba(255,255,255,0.2)" stroke-width="2" transform="rotate(45)"/>
    <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="6 3" transform="rotate(45)"/>
    <rect x="-14" y="-14" width="28" height="28" fill="url(#primaryGrad)" transform="rotate(45)"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="85" font-family="'Michroma', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#F5F7FA" letter-spacing="3">
    SPLITFLOW
  </text>
  <text x="160" y="112" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F97316" letter-spacing="4">
    STELLAR SOROBAN PROTOCOL
  </text>
</svg>
