<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="#050505" rx="20"/>
  <rect x="2" y="2" width="196" height="196" fill="none" stroke="rgba(249, 115, 22, 0.4)" stroke-width="2" rx="18"/>

  <g transform="translate(100, 100)">
    <!-- Outer Rotated Frame -->
    <rect x="-50" y="-50" width="100" height="100" fill="#0C0D10" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" transform="rotate(45)"/>
    <!-- Orbit Dash Ring -->
    <rect x="-38" y="-38" width="76" height="76" fill="none" stroke="#F97316" stroke-width="2.5" stroke-dasharray="8 4" transform="rotate(45)"/>
    <!-- Core Diamond -->
    <rect x="-20" y="-20" width="40" height="40" fill="url(#markGrad)" transform="rotate(45)"/>
  </g>
</svg>
