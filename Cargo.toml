# SplitFlow Soroban Smart Contract Workspace v2.1.0
[workspace]
resolver = "2"
members = [
    "contracts/royalty_manager",
    "contracts/royalty_distributor",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
